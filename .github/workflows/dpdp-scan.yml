name: DPDP AI Exposure Scan

on:
  pull_request:
    paths:
      - "**/*.py"
      - "action.yml"
      - ".github/workflows/dpdp-scan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dpdp-ai-scanner on itself
        uses: ./
        with:
          path: examples
          fail-on: none
