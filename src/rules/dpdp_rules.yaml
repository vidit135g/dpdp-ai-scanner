# DPDP Act obligation rules
#
# Each rule fires based on a finding's risk_level from the dataflow module.
# These map to the Digital Personal Data Protection Act, 2023 (India) at a
# section level. This is a compliance-triage aid, not legal advice, and
# should be reviewed by qualified counsel before being relied on.

rules:
  HIGH:
    obligations:
      - id: "DPDP-S8-CONSENT"
        title: "Section 8 — Data Fiduciary obligations / legal basis for processing"
        description: >
          Personal data appears to be transmitted to a third-party AI
          processor. Confirm a valid legal basis exists: either informed
          consent under Section 6, or one of the legitimate-use exemptions
          under Section 7.
      - id: "DPDP-S16-TRANSFER"
        title: "Section 16 — Cross-border data transfer"
        description: >
          Most AI vendor APIs process data outside India. Confirm the
          destination is not a restricted jurisdiction and that transfer
          conditions are met.
      - id: "DPDP-PROCESSOR-DPA"
        title: "Data Processor Agreement"
        description: >
          Confirm a data processing agreement is on file with this AI
          vendor, defining purpose limitation, retention, and deletion
          obligations for the data being sent.
    remediation: >
      Verify the legal basis for this call, confirm a DPA exists with the
      vendor, and document the retention/deletion terms before this code
      path ships to production with real user data.

  MEDIUM:
    obligations:
      - id: "DPDP-REVIEW-NEEDED"
        title: "Manual review recommended"
        description: >
          The payload naming is too generic to classify automatically.
          A human reviewer should confirm whether personal data is present.
    remediation: >
      Manually inspect this call site to confirm whether personal data is
      included in the payload before assuming it is clear.

  LOW:
    obligations:
      - id: "DPDP-BASELINE-AWARENESS"
        title: "Baseline third-party transfer awareness"
        description: >
          No personal-data indicators were detected, but any call to a
          third-party AI vendor is still a data transfer worth logging in
          your AI system inventory for audit-readiness.
    remediation: >
      No immediate action required. Log this vendor in your AI system
      inventory for completeness.
